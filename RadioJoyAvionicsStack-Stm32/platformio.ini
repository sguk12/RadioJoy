; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8]
platform = ststm32@19.5.0 ; 19.5.0 is here to avoid the platform's own USB support introduced after this version
; TODO: switch to the platform USB support. When they introduce a joystick hid implementation for the PluggableUSB.h
board = genericSTM32F103C8
framework = arduino
lib_deps =
    https://github.com/Levi--G/USBLibrarySTM32.git
    https://github.com/MHeironimus/ArduinoJoystickLibrary.git
    https://github.com/mathertel/RotaryEncoder.git

build_flags = 
	-D USBCON
	-D HAL_PCD_MODULE_ENABLED
  -D USB_CFGBUFFER_LEN=256
  '-D USB_PRODUCT_STRING="AvionicsStack"'
  ; own PID so Windows and games don't confuse this with the old RadioJoy receiver (USBLibrarySTM32 default 0483:5711)
  -D USBD_VID=0x0483
  -D USBD_PID=0x5712

monitor_speed = 115200

upload_protocol = stlink
; ststm32@19.5.0 hardcodes "transport select hla_swd", which the shared newer tool-openocd (3.1200.7) rejects,
; so the upload command is spelled out here with "swd". Keep it on ONE line: PlatformIO runs only the first line of a multi-line upload_command
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select swd" -c "set CPUTAPID 0x2ba01477" -f target/stm32f1x.cfg -c "program {$SOURCE} verify reset exit"
debug_tool = stlink
debug_server =
  ${platformio.packages_dir}/tool-openocd/bin/openocd
  -s ${platformio.packages_dir}/tool-openocd/openocd/scripts
  -f interface\stlink.cfg
  -c "transport select swd"
  -c "set CPUTAPID 0x2ba01477"
  -f target\stm32f1x.cfg
  -c "reset_config none"

